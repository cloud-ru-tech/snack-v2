packages:
  - 'packages/*'
  - 'apps/*'
  - 'tests'

catalog:
  '@cloud-ru/ft-request-payload-transform': ^0.3.0
  # 1.61.1+ ломает прогон: `playwright/package.json` объявляет `type: module`, а
  # Playwright для таких `.ts` компилирует CJS-вывод и грузит его как ESM — коллекция
  # тестов падает на `does not provide an export named …` / `exports is not defined in
  # ES module scope`. 1.61.0 — последняя версия, на которой suite собирается.
  '@playwright/test': 1.61.0
  '@dnd-kit/core': ^6.3.1
  '@dnd-kit/modifiers': ^9.0.0
  '@dnd-kit/sortable': ^10.0.0
  '@dnd-kit/utilities': ^3.2.2
  '@tanstack/match-sorter-utils': ^8.19.4
  '@tanstack/react-virtual': ^3.14.8
  '@types/react': 18.3.28
  '@types/react-dom': 18.3.7
  classnames: ^2.5.1
  merge-refs: ^2.0.0
  react: 18.3.1
  playwright: 1.61.0
  react-colorful: ^5.8.0
  remark-gfm: ^4.0.1
  react-dom: 18.3.1
  react-remove-scroll: ^2.7.2
  react-textarea-autosize: ^8.5.9
  react-transition-state: ^2.4.0
  sass: 1.102.0
  shiki: 4.3.1
  tabbable: ^6.5.0
  typescript: 5.9.3
  unified: ^11.0.5
  vitest: 4.1.10
  '@vitest/browser': 4.1.10
  '@vitest/browser-playwright': 4.1.10
  '@vitest/coverage-istanbul': 4.1.10

ignoredBuiltDependencies:
  - ejs

linkWorkspacePackages: true

onlyBuiltDependencies:
  - '@cloud-ru/ft-config-husky'

saveWorkspaceProtocol: rolling

shamefullyHoist: true

sideEffectsCache: false
