packages:
  - packages/*
  - astro

# Только общие зависимости корня и astro. Публикуемые пакеты (packages/*) — версии явно.
catalog:
  'classnames': '2.5.1'
  'consola': '3.4.2'
  'react': '19.2.4'
  'react-dom': '19.2.4'
  'typescript': '5.9.3'
  '@sbercloud/figma-variables': '1.4.8-63f7e661.0'

ignoredBuiltDependencies:
  - ejs

linkWorkspacePackages: true

onlyBuiltDependencies:
  - '@cloud-ru/ft-config-husky'

saveWorkspaceProtocol: false

shamefullyHoist: true

sideEffectsCache: false
