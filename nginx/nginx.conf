server {
  include mime.types;
  types {
    application/javascript mjs;
  }
  server_tokens off;
  listen 80;
  root   /usr/share/nginx/html;
  index  index.html index.htm;

  # Serve precompressed .br / .gz files produced by `pnpm build` (precompress.mjs).
  # `*_static on` requires the respective nginx modules; `always` keeps headers on 304 responses.
  gzip_static on;
  gzip_vary on;
  # Runtime gzip for assets we didn't precompress (rare).
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain text/css text/xml application/xml application/xml+rss
    application/javascript application/x-javascript application/json
    image/svg+xml font/ttf font/otf application/vnd.ms-fontobject;

  # Optional: enable only if nginx is built with ngx_brotli (many alpine images lack it).
  # brotli_static on;
  # brotli on;
  # brotli_types text/plain text/css application/javascript application/json image/svg+xml;

  # Astro hashed assets — safe to cache forever.
  location /_astro/ {
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Fonts / images / static media — medium TTL.
  location ~* \.(woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|avif|ico)$ {
    access_log off;
    add_header Cache-Control "public, max-age=2592000" always;
    try_files $uri =404;
  }

  # HTML — revalidate every navigation so deploys take effect, body reused via ETag/304.
  location / {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }

  location = /health-check {
    access_log off;
    return 200;
  }

  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    root /usr/share/nginx/html;
  }
}
